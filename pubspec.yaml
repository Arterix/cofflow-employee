name: employee_app
description: "Konco Space Employee Cashier App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0

  # Routing
  go_router: ^13.0.0

  # Firebase + Push
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # UI
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  shimmer: ^3.0.0

  # Format
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/koncospace_logo.svg
